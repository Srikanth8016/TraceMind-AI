name: CI — TraceMind AI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Lint, Migrations & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tracemind
          POSTGRES_PASSWORD: tracemind
          POSTGRES_DB: tracemind
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: testing
      DATABASE_URL: postgresql+psycopg://tracemind:tracemind@localhost:5432/tracemind
      TEST_DATABASE_URL: postgresql+psycopg://tracemind:tracemind@localhost:5432/tracemind
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      TRACEMIND_API_KEY: test-secret-key-12345
      JWT_SECRET_KEY: test-secure-random-jwt-secret-at-least-32chars
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      CELERY_TASK_ALWAYS_EAGER: "True"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code compilation and syntax verification
        run: |
          python -m compileall app alembic tests

      - name: Run database migrations against PostgreSQL
        run: |
          python -m alembic upgrade head

      - name: Execute complete test suite (unit, integration, e2e)
        run: |
          python -m pytest tests/ -v

  frontend-build:
    name: Frontend Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Build Production Docker Image
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: tracemind-ai:ci
          load: true

# ---------------------------------------------------------------------------
# TraceMind AI — Production-shaped Docker Compose stack
#
# Services:
# - db      : PostgreSQL 16 with pgvector extension (persistent storage)
# - redis   : Redis 7 in-memory cache and Celery broker (persistent storage)
# - api     : FastAPI web application server
# - worker  : Celery asynchronous background investigation worker
#
# Usage:
#   docker compose up -d          # Start entire platform in background
#   docker compose ps             # Inspect container health states
#   docker compose logs -f api    # Stream API server logs
#   docker compose down           # Stop services (data survives in named volumes)
#   docker compose down -v        # Stop AND wipe database/redis volumes
# ---------------------------------------------------------------------------

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tracemind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-tracemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracemind}
      POSTGRES_DB:       ${POSTGRES_DB:-tracemind}
    ports:
      # Bound strictly to 127.0.0.1 to avoid exposing PostgreSQL publicly
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tracemind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracemind} -d ${POSTGRES_DB:-tracemind}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tracemind_net

  redis:
    image: redis:7-alpine
    container_name: tracemind-redis
    restart: unless-stopped
    ports:
      # Bound strictly to 127.0.0.1 to avoid exposing Redis publicly
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - tracemind_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - tracemind_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracemind-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracemind}:${POSTGRES_PASSWORD:-tracemind}@db:5432/${POSTGRES_DB:-tracemind}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TRACEMIND_API_KEY: ${TRACEMIND_API_KEY:-dev-api-key-tracemind-32bytes}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tracemind_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracemind-worker
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracemind}:${POSTGRES_PASSWORD:-tracemind}@db:5432/${POSTGRES_DB:-tracemind}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TRACEMIND_API_KEY: ${TRACEMIND_API_KEY:-dev-api-key-tracemind-32bytes}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tracemind_net

volumes:
  tracemind_pgdata:
  tracemind_redisdata:

networks:
  tracemind_net:
    driver: bridge

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    unit: Fast in-memory unit tests with no external dependencies
    integration: API and database integration tests
    e2e: Complete end-to-end event ingestion to AI investigation workflows
    slow: Tests with multi-step or simulated concurrency operations

# render.yaml — Render Blueprint configuration for TraceMind AI
# Zero-Budget Free Tier Deployment Specification
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tracemind-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && python -m alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: TRACEMIND_API_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "*"
